name: Bug report
description: Something the module does that it should not, or something it fails to do.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, credentials, or private account data. Use a small example, or point at a file under `schemas/examples/` or `test/fixtures/`. For a vulnerability, use private vulnerability reporting instead of this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The module version, or the commit you built.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands and a small input that shows the problem. Leave out anything secret.
    validations:
      required: true
